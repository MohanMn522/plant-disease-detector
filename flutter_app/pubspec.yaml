name: plant_disease_detector
description: A Flutter app for detecting plant diseases using ML models.
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  google_sign_in: ^6.2.1
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.0
  permission_handler: ^11.3.0
  http: ^1.2.0
  json_annotation: ^4.8.1
  path: ^1.8.3
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1   # 👈 added for app icon

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
